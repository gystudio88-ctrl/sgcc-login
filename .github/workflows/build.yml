name: Build Application

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Build
        run: |
          pyinstaller browser_launcher.py --name "账号管理" --onefile --windowed --noconfirm --clean --hidden-import customtkinter --hidden-import requests --hidden-import qrcode --hidden-import PIL
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/账号管理.exe

  build-macos-intel:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install system dependencies
        run: |
          brew install python-tk
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Build
        run: |
          pyinstaller browser_launcher.py --name "账号管理-macOS-Intel" --onefile --windowed --noconfirm --clean --hidden-import customtkinter --hidden-import requests --hidden-import qrcode --hidden-import PIL
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: dist/账号管理-macOS-Intel

  build-macos-arm:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install system dependencies
        run: |
          brew install python-tk
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Build
        run: |
          pyinstaller browser_launcher.py --name "账号管理-macOS-ARM" --onefile --windowed --noconfirm --clean --hidden-import customtkinter --hidden-import requests --hidden-import qrcode --hidden-import PIL
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/账号管理-macOS-ARM

  build-linux-x64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-dev libgtk-3-dev
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Build
        run: |
          pyinstaller browser_launcher.py --name "账号管理-Linux-x64" --onefile --noconfirm --clean --hidden-import customtkinter --hidden-import requests --hidden-import qrcode --hidden-import PIL
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: dist/账号管理-Linux-x64

  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-dev libgtk-3-dev
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Build
        run: |
          pyinstaller browser_launcher.py --name "账号管理-Linux-ARM64" --onefile --noconfirm --clean --hidden-import customtkinter --hidden-import requests --hidden-import qrcode --hidden-import PIL
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: dist/账号管理-Linux-ARM64

  release:
    needs: [build-windows, build-macos-intel, build-macos-arm, build-linux-x64, build-linux-arm64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release
      
      - name: List files
        run: ls -R ./release
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./release/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
